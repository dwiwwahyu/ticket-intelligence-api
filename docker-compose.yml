services:
  postgres:
    image: postgres:16
    container_name: ticket-intelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_password
      POSTGRES_DB: ticket_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ticket-intelligence-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: